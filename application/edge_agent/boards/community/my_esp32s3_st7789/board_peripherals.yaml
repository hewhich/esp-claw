version: 1.0.0
# Peripherals for ESP32-S3 + ST7789 2.4in + INMP441 + MAX98357A
peripherals:

  # ST7789 LCD on SPI2_HOST (7-pin module, backlight tied to 3.3V -> no LEDC device)
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 11
        sclk_io_num: 12
        # esp_lcd's SPI io needs a private DMA bounce buffer in internal RAM
        # (the LVGL draw buffers live in PSRAM, which the SPI DMA cannot read
        # directly). 19200 failed outright; 4800 also failed once the extra
        # LwIP sockets / tiny_ttf font engine were enabled. 1920 = 4 lines of
        # RGB565 leaves plenty of head-room and still moves a full 240x320
        # frame in ~80 queued chunks.
        max_transfer_sz: 1920

  # MAX98357A class-D amplifier: I2S0 STD TX, ESP is master
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config:
      port: 1
      sample_rate_hz: 16000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_MONO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: -1
        bclk: 15
        ws: 16
        dout: 7
        din: -1

  # INMP441 MEMS microphone: I2S0 STD RX, ESP is master
  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config:
      port: 0
      sample_rate_hz: 16000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_MONO
      slot_mask: I2S_STD_SLOT_LEFT
      ws_width: 16
      pins:
        mclk: -1
        bclk: 4
        ws: 5
        dout: -1
        din: 3
