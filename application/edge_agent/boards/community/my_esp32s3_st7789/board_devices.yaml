version: 1.0.0
# Devices Configuration for my_esp32s3_st7789
devices:
  # SPI Display Device (ST7789 240x320 portrait, 2.4 inch module)
  # SCLK=IO12, MOSI=IO11, CS=IO10, DC=IO9, RST=IO8, BL=IO7
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: false
      mirror_y: false
      swap_xy: false
      invert_color: true
      x_max: 240
      y_max: 320
      io_spi_config:
        cs_gpio_num: 10
        dc_gpio_num: 9
        spi_mode: 3
        pclk_hz: 40000000

      lcd_panel_config:
        reset_gpio_num: 8
        data_endian: "LCD_RGB_DATA_ENDIAN_BIG"
        flags:
          reset_active_high: false
        vendor_config: NULL

    peripherals:
    - name: spi_display
