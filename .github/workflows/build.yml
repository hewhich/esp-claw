name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bmgr helper
        run: |
          . $IDF_PATH/export.sh > /dev/null
          python -m pip install --upgrade pip
          pip install esp-bmgr-assist

      - name: Configure board and build (retry loop)
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig
          idf.py bmgr -c ./boards -b my_esp32s3_st7789
          sed -i '/ESP_PLAYER_ENABLE_VIDEO/d' components/gen_bmgr_codes/board_manager.defaults 2>/dev/null || true
          
          # Retry build up to 10 times until kconfig converges
          for i in $(seq 1 10); do
            echo "=== Build attempt $i ==="
            if idf.py build; then
              echo "=== Build succeeded on attempt $i ==="
              break
            fi
            echo "=== Build attempt $i failed, retrying ==="
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: application/edge_agent/build/*.bin
