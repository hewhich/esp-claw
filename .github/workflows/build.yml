name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    # Container jobs default to /bin/sh; export.sh needs bash to activate the venv.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix python dependencies
        # espressif/idf:v5.5.4 ships idf-component-manager 3.x, but IDF 5.5 requires ~=2.2,
        # which makes export.sh abort with "Activation script failed".
        run: |
          python -m pip --version
          python -m pip install --upgrade "idf-component-manager~=2.2"
          python -m pip install --upgrade esp-bmgr-assist
          python -m pip install --upgrade "idf-component-manager~=2.2"
          python -m pip show idf-component-manager | head -3

      - name: Show IDF environment
        run: |
          . $IDF_PATH/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Select board
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          rm -rf build sdkconfig sdkconfig.old
          idf.py bmgr -c ./boards -b my_esp32s3_st7789

      - name: Build
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Merge firmware image
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          esptool.py --chip esp32s3 merge_bin -o build/edge_agent_merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB @build/flash_args

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: |
            application/edge_agent/build/*.bin
            application/edge_agent/build/bootloader/*.bin
            application/edge_agent/build/partition_table/*.bin
            application/edge_agent/build/flash_args
