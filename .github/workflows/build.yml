name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bmgr helper
        run: |
          . $IDF_PATH/export.sh > /dev/null
          python -m pip install --upgrade pip
          pip install esp-bmgr-assist

      - name: Select board first, then set target & build (ESP32-S3 + ST7789 2.4in + INMP441 + MAX98357A)
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          # 先选板型，生成板级配置（含音频/显示使能符号），再配置目标，最后编译
          idf.py bmgr -c ./boards -b my_esp32s3_st7789
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: application/edge_agent/build/*.bin
