name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    # Container jobs default to /bin/sh; the IDF env script needs bash.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enter IDF environment
        # Do not source export.sh: activate_venv.py aborts on a python dependency
        # version check inside the container. idf_tools.py export only sets paths,
        # and keeps the image's own idf-component-manager (3.x), which understands
        # the repo's relative path dependencies.
        # Written to a file because exporting PATH through GITHUB_ENV leaves the
        # literal "$PATH" unexpanded and breaks every later step.
        run: |
          $IDF_PATH/tools/idf_tools.py export > /tmp/idf_env.sh
          . /tmp/idf_env.sh
          echo "IDF_PATH=$IDF_PATH"
          which bash idf.py python

      - name: Show IDF environment
        run: |
          . /tmp/idf_env.sh
          idf.py --version
          python -m pip show idf-component-manager | sed -n '1,2p'

      - name: Install board manager helper
        run: |
          . /tmp/idf_env.sh
          python -m pip install --upgrade esp-bmgr-assist

      - name: Select board
        working-directory: application/edge_agent
        run: |
          . /tmp/idf_env.sh
          rm -rf build sdkconfig sdkconfig.old
          # The checked-in lock file predates several components (cap_files,
          # esp_hls_stream, ...), which forces a re-solve on every configure pass.
          # Start from a clean solve so the resolution is written once and reused.
          rm -f dependencies.lock
          idf.py bmgr -c ./boards -b my_esp32s3_st7789

      - name: Build
        working-directory: application/edge_agent
        # The dependency solver discovers new components across passes (the lock
        # file in the repo is stale), and each pass regenerates Kconfig. idf.py
        # only retries its own configure step twice, so allow a few outer
        # attempts for the resolution to converge.
        run: |
          . /tmp/idf_env.sh
          for attempt in 1 2 3 4; do
            echo "=== build attempt $attempt ==="
            if idf.py build; then
              echo "build succeeded on attempt $attempt"
              exit 0
            fi
          done
          echo "build did not converge" >&2
          exit 1

      - name: Merge firmware image
        working-directory: application/edge_agent
        run: |
          . /tmp/idf_env.sh
          esptool.py --chip esp32s3 merge_bin -o build/edge_agent_merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB @build/flash_args

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: |
            application/edge_agent/build/*.bin
            application/edge_agent/build/bootloader/*.bin
            application/edge_agent/build/partition_table/*.bin
            application/edge_agent/build/flash_args
