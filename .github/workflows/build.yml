name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bmgr helper
        run: |
          . $IDF_PATH/export.sh > /dev/null
          python -m pip install --upgrade pip
          pip install esp-bmgr-assist

      - name: Debug kconfig convergence
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig
          idf.py bmgr -c ./boards -b my_esp32s3_st7789
          sed -i '/ESP_PLAYER_ENABLE_VIDEO/d' components/gen_bmgr_codes/board_manager.defaults 2>/dev/null || true

          echo "=== sdkconfig.defaults ==="
          cat sdkconfig.defaults

          echo "=== board_manager.defaults ==="
          cat components/gen_bmgr_codes/board_manager.defaults

          echo "=== First kconfig run ==="
          idf.py reconfigure 2>&1 | head -100 || true

          echo "=== sdkconfig after run 1 ==="
          cat sdkconfig | head -50

          echo "=== Check for unknown symbols ==="
          grep -i "unknown\|warning\|deprecated" sdkconfig || echo "none found"
