name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deps lock
        run: |
          ls -la application/edge_agent/dependencies.lock 2>/dev/null || echo "no lock file"
          head -50 application/edge_agent/dependencies.lock 2>/dev/null || true

      - name: Set target and build
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig
          idf.py set-target esp32s3
          idf.py build 2>&1 | tail -30
