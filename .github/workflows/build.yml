name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find serialize_model
        run: |
          grep -r "serialize_model" --include="Kconfig*" . 2>/dev/null || echo "not found in Kconfig"
          grep -r "serialize_model" --include="*.py" . 2>/dev/null | head -10 || echo "not found in py"

      - name: Set target and build
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig
          idf.py set-target esp32s3
          idf.py build 2>&1 | tail -50
