name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bmgr helper
        run: |
          . $IDF_PATH/export.sh > /dev/null
          python -m pip install --upgrade pip
          pip install esp-bmgr-assist

      - name: Patch kconfig retry loop
        run: |
          # Replace the two-state retry (0->1->give up) with a 20-retry loop
          python3 -c "
          import re
          with open('$IDF_PATH/tools/cmake/project.cmake', 'r') as f:
              content = f.read()
          
          # Replace the retry logic
          old = '''elseif(result EQUAL 10 AND retried EQUAL 0)
            message(WARNING \"Missing kconfig option. Re-run the build process...\")
            set(retried 1)
        elseif(result EQUAL 10 AND retried EQUAL 1)
            message(FATAL_ERROR \"Missing required kconfig option after retry.\")'''
          
          new = '''elseif(result EQUAL 10)
            math(EXPR retried \"\${retried} + 1\")
            if(retried LESS 20)
                message(WARNING \"Missing kconfig option. Re-run the build process... (\${retried}/20)\")
            else()
                message(FATAL_ERROR \"Missing required kconfig option after retry.\")
            endif()'''
          
          content = content.replace(old, new)
          with open('$IDF_PATH/tools/cmake/project.cmake', 'w') as f:
              f.write(content)
          print('Patched successfully')
          "
          grep -A5 "result EQUAL 10" $IDF_PATH/tools/cmake/project.cmake

      - name: Configure board and build
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig
          idf.py bmgr -c ./boards -b my_esp32s3_st7789
          sed -i '/ESP_PLAYER_ENABLE_VIDEO/d' components/gen_bmgr_codes/board_manager.defaults 2>/dev/null || true
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: application/edge_agent/build/*.bin
