name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade component manager
        run: |
          . $IDF_PATH/export.sh > /dev/null
          python -m pip install --upgrade pip
          pip install --upgrade idf-component-manager esp-bmgr-assist

      - name: Build
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: application/edge_agent/build/*.bin
