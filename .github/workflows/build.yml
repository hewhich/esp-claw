name: build-edge-agent

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bmgr helper
        run: |
          . $IDF_PATH/export.sh > /dev/null
          python -m pip install --upgrade pip
          pip install esp-bmgr-assist

      - name: Debug kconfig loop
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh > /dev/null
          rm -rf build sdkconfig components/gen_bmgr_codes
          idf.py bmgr -c ./boards -b my_esp32s3_st7789
          sed -i '/ESP_PLAYER_ENABLE_VIDEO/d' components/gen_bmgr_codes/board_manager.defaults 2>/dev/null || true

          # Run reconfigure once, save sdkconfig
          idf.py reconfigure || true
          cp sdkconfig /tmp/sdkconfig_after_pass1.txt

          # Run reconfigure again, save sdkconfig
          idf.py reconfigure || true
          cp sdkconfig /tmp/sdkconfig_after_pass2.txt

          # Run reconfigure a third time
          idf.py reconfigure || true
          cp sdkconfig /tmp/sdkconfig_after_pass3.txt

          echo "=== DIFF pass1 vs pass2 ==="
          diff /tmp/sdkconfig_after_pass1.txt /tmp/sdkconfig_after_pass2.txt | head -50
          echo "=== DIFF pass2 vs pass3 ==="
          diff /tmp/sdkconfig_after_pass2.txt /tmp/sdkconfig_after_pass3.txt | head -50

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-firmware
          path: application/edge_agent/build/*.bin
